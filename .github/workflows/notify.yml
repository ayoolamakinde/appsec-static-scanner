name: Send Security Notification

on:
  workflow_call:
    inputs:
      notification_type:
        required: true
        type: string
        description: 'Type of notification: vulnerability, violation, secret, finding, custom'
      severity:
        required: false
        type: string
        default: 'MEDIUM'
        description: 'Severity level: CRITICAL, HIGH, MEDIUM, LOW, INFO'
      tool_name:
        required: true
        type: string
        description: 'Name of scanning tool: Trivy, Semgrep, Checkov, TruffleHog'
      finding_count:
        required: true
        type: number
        description: 'Number of findings/vulnerabilities detected'
      message:
        required: false
        type: string
        description: 'Custom message to include'
      affected_files:
        required: false
        type: string
        description: 'Comma-separated list of affected files'
    secrets:
      TEAMS_WEBHOOK:
        required: false
        description: 'Microsoft Teams webhook URL'
      SLACK_WEBHOOK:
        required: false
        description: 'Slack webhook URL'

jobs:
  notify:
    name: Send Notifications
    runs-on: ubuntu-latest
    
    steps:
      - name: Determine Notification Channel
        id: channel
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.TEAMS_WEBHOOK }}" ]; then
            echo "teams_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "teams_enabled=false" >> $GITHUB_OUTPUT
          fi
          
          if [ -n "${{ secrets.SLACK_WEBHOOK }}" ]; then
            echo "slack_enabled=true" >> $GITHUB_OUTPUT
          else
            echo "slack_enabled=false" >> $GITHUB_OUTPUT
          fi
          
          if [ "${{ steps.channel.outputs.teams_enabled }}" = "false" ] && [ "${{ steps.channel.outputs.slack_enabled }}" = "false" ]; then
            echo "⚠️ No notification webhooks configured"
            exit 0
          fi

      - name: Prepare Notification Data
        id: prepare
        continue-on-error: true
        run: |
          # Determine emoji and color based on severity
          case "${{ inputs.severity }}" in
            CRITICAL)
              EMOJI="🚨"
              COLOR="DC143C"
              SLACK_COLOR="danger"
              ;;
            HIGH)
              EMOJI="🔴"
              COLOR="FF4500"
              SLACK_COLOR="danger"
              ;;
            MEDIUM)
              EMOJI="🟠"
              COLOR="FFA500"
              SLACK_COLOR="warning"
              ;;
            LOW)
              EMOJI="🟡"
              COLOR="FFD700"
              SLACK_COLOR="warning"
              ;;
            *)
              EMOJI="ℹ️"
              COLOR="4169E1"
              SLACK_COLOR="good"
              ;;
          esac
          
          echo "emoji=$EMOJI" >> $GITHUB_OUTPUT
          echo "color=$COLOR" >> $GITHUB_OUTPUT
          echo "slack_color=$SLACK_COLOR" >> $GITHUB_OUTPUT
          
          # Format title
          case "${{ inputs.notification_type }}" in
            vulnerability)
              TITLE="$EMOJI Vulnerabilities Detected"
              ;;
            violation)
              TITLE="$EMOJI Policy Violations Found"
              ;;
            secret)
              TITLE="$EMOJI Secrets Detected"
              ;;
            finding)
              TITLE="$EMOJI Security Findings"
              ;;
            custom)
              TITLE="$EMOJI Security Alert"
              ;;
          esac
          
          echo "title=$TITLE" >> $GITHUB_OUTPUT

      - name: Send Teams Notification
        if: steps.channel.outputs.teams_enabled == 'true'
        uses: skitionek/notify-microsoft-teams@master
        continue-on-error: true
        with:
          webhook_url: ${{ secrets.TEAMS_WEBHOOK }}
          raw: |
            {
              "type": "message",
              "attachments": [{
                "contentType": "application/vnd.microsoft.card.adaptive",
                "content": {
                  "type": "AdaptiveCard",
                  "body": [
                    {
                      "type": "TextBlock",
                      "size": "Large",
                      "weight": "Bolder",
                      "text": "${{ steps.prepare.outputs.title }}",
                      "color": "${{ steps.prepare.outputs.color }}"
                    },
                    {
                      "type": "FactSet",
                      "facts": [
                        { "title": "Repository:", "value": "${{ github.repository }}" },
                        { "title": "Tool:", "value": "${{ inputs.tool_name }}" },
                        { "title": "Severity:", "value": "${{ inputs.severity }}" },
                        { "title": "Findings:", "value": "${{ inputs.finding_count }}" },
                        { "title": "Branch:", "value": "${{ github.ref_name }}" },
                        { "title": "Triggered by:", "value": "${{ github.actor }}" }
                      ]
                    },
                    {
                      "type": "TextBlock",
                      "text": "${{ inputs.message }}",
                      "wrap": true,
                      "spacing": "Medium",
                      "isVisible": ${{ inputs.message != '' }}
                    },
                    {
                      "type": "TextBlock",
                      "text": "**Affected Files:**\n${{ inputs.affected_files }}",
                      "wrap": true,
                      "spacing": "Medium",
                      "isVisible": ${{ inputs.affected_files != '' }}
                    }
                  ],
                  "actions": [
                    {
                      "type": "Action.OpenUrl",
                      "title": "🔍 View Workflow Run",
                      "url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    },
                    {
                      "type": "Action.OpenUrl",
                      "title": "📋 View PR",
                      "url": "https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}",
                      "isVisible": ${{ github.event_name == 'pull_request' }}
                    }
                  ],
                  "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
                  "version": "1.4"
                }
              }]
            }

      - name: Notification Summary
        if: always()
        continue-on-error: true
        run: |
          echo "📢 Notification Summary"
          echo "======================="
          echo "Tool: ${{ inputs.tool_name }}"
          echo "Type: ${{ inputs.notification_type }}"
          echo "Severity: ${{ inputs.severity }}"
          echo "Findings: ${{ inputs.finding_count }}"
          echo "Teams Enabled: ${{ steps.channel.outputs.teams_enabled }}"
          echo "Slack Enabled: ${{ steps.channel.outputs.slack_enabled }}"
