name: SECRETS - Credential Detection

on:
  workflow_call:
    inputs:
      scan_type:
        required: false
        type: string
        default: 'verified,unverified'
        description: 'Scan type: verified (found in wild), unverified (potential), both'
      include_detectors:
        required: false
        type: string
        description: 'Comma-separated list of detectors to enable (empty = all)'
      exclude_detectors:
        required: false
        type: string
        description: 'Comma-separated list of detectors to disable'
      skip_paths:
        required: false
        type: string
        default: '.git,.venv,node_modules,vendor,examples,tests,dist,build'
        description: 'Paths to exclude from scanning'
      entropy_threshold:
        required: false
        type: number
        default: 3.0
        description: 'Entropy threshold for secret detection (3.0-8.0)'
      scan_history:
        required: false
        type: boolean
        default: true
        description: 'Scan git history for secrets'
      only_verified:
        required: false
        type: boolean
        default: false
        description: 'Only report verified secrets (found in wild)'
      json_output:
        required: false
        type: boolean
        default: true
        description: 'Generate JSON output'
      max_depth:
        required: false
        type: number
        default: 1000000
        description: 'Maximum depth for git history scanning'
      fail_on_finding:
        required: false
        type: boolean
        default: true
        description: 'Fail workflow if secrets found'
      continue_on_error:
        required: false
        type: boolean
        default: false
        description: 'Continue even if scan fails'
      upload_artifacts:
        required: false
        type: boolean
        default: true
        description: 'Upload results as artifacts'
      create_issue:
        required: false
        type: boolean
        default: true
        description: 'Create critical issue for secrets'
      comment_pr:
        required: false
        type: boolean
        default: true
        description: 'Comment PR with findings'
    secrets:
      SECURITY_WEBHOOK:
        required: false

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write

env:
  TRUFFLEHOG_TIMEOUT: 300

jobs:
  secrets-scan:
    name: Secrets Detection Scan
    runs-on: ubuntu-latest
    outputs:
      secrets_found: ${{ steps.analyze.outputs.secrets_found }}
      verified_count: ${{ steps.analyze.outputs.verified_count }}
      unverified_count: ${{ steps.analyze.outputs.unverified_count }}
      scan_status: ${{ steps.analyze.outputs.scan_status }}
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        id: install
        continue-on-error: true
        run: |
          echo "📦 Installing TruffleHog..."
          pip3 install truffleHog --upgrade
          truffleHog --version
          echo "✅ TruffleHog installed"

      - name: Prepare Scan Arguments
        id: args
        run: |
          # Build detector flags
          DETECTOR_FLAGS=""
          
          if [ -n "${{ inputs.include_detectors }}" ]; then
            IFS=',' read -ra DETECTORS <<< "${{ inputs.include_detectors }}"
            for detector in "${DETECTORS[@]}"; do
              DETECTOR_FLAGS="$DETECTOR_FLAGS --detector $(echo $detector | xargs)"
            done
          fi
          
          if [ -n "${{ inputs.exclude_detectors }}" ]; then
            IFS=',' read -ra DETECTORS <<< "${{ inputs.exclude_detectors }}"
            for detector in "${DETECTORS[@]}"; do
              DETECTOR_FLAGS="$DETECTOR_FLAGS --detector=$(echo $detector | xargs) false"
            done
          fi
          
          echo "detector_flags=$DETECTOR_FLAGS" >> $GITHUB_OUTPUT
          
          # Determine verification level
          if [ "${{ inputs.only_verified }}" = "true" ]; then
            echo "verification=verified" >> $GITHUB_OUTPUT
          else
            echo "verification=${{ inputs.scan_type }}" >> $GITHUB_OUTPUT
          fi

      - name: Run Secrets Scan
        id: scan
        continue-on-error: ${{ inputs.continue_on_error }}
        timeout-minutes: 10
        run: |
          echo "🔍 Running TruffleHog secrets scan..."
          
          # Build command
          CMD="truffleHog filesystem . \
            --json \
            --entropy=${{ inputs.entropy_threshold }} \
            --max-depth=${{ inputs.max_depth }}"
          
          # Add detector flags
          if [ -n "${{ steps.args.outputs.detector_flags }}" ]; then
            CMD="$CMD ${{ steps.args.outputs.detector_flags }}"
          fi
          
          # Scan current state
          echo "Scanning current state..."
          eval "$CMD" > secrets-results-current.json 2>&1 || true
          
          # Scan git history if enabled
          if [ "${{ inputs.scan_history }}" = "true" ]; then
            echo "Scanning git history..."
            truffleHog git file:// \
              --json \
              --entropy=${{ inputs.entropy_threshold }} \
              > secrets-results-history.json 2>&1 || true
          fi
          
          echo "✅ Secrets scan completed"
          echo "scan_status=completed" >> $GITHUB_OUTPUT

      - name: Merge and Analyze Results
        id: analyze
        if: always()
        run: |
          echo "📊 Analyzing secrets results..."
          
          # Combine results
          cat secrets-results-current.json secrets-results-history.json 2>/dev/null | \
            jq -s 'add // empty' > secrets-combined.json || echo "[]" > secrets-combined.json
          
          if [ ! -f "secrets-combined.json" ] || [ ! -s "secrets-combined.json" ]; then
            echo "⚠️ No secrets data found"
            echo "secrets_found=false" >> $GITHUB_OUTPUT
            echo "verified_count=0" >> $GITHUB_OUTPUT
            echo "unverified_count=0" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          # Count verified vs unverified
          VERIFIED=$(cat secrets-combined.json | jq '[.[] | select(.verified==true)] | length' 2>/dev/null || echo "0")
          UNVERIFIED=$(cat secrets-combined.json | jq '[.[] | select(.verified==false)] | length' 2>/dev/null || echo "0")
          TOTAL=$((VERIFIED + UNVERIFIED))
          
          echo "verified_count=$VERIFIED" >> $GITHUB_OUTPUT
          echo "unverified_count=$UNVERIFIED" >> $GITHUB_OUTPUT
          
          if [ $TOTAL -gt 0 ]; then
            echo "secrets_found=true" >> $GITHUB_OUTPUT
            echo "🚨 SECRETS DETECTED:"
            echo "  - VERIFIED: $VERIFIED (found in wild)"
            echo "  - UNVERIFIED: $UNVERIFIED (potential)"
            echo "  - TOTAL: $TOTAL"
          else
            echo "secrets_found=false" >> $GITHUB_OUTPUT
            echo "✅ No secrets detected"
          fi

      - name: Generate Report
        id: report
        if: always()
        run: |
          echo "📋 Generating secrets report..."
          
          VERIFIED=${{ steps.analyze.outputs.verified_count }}
          UNVERIFIED=${{ steps.analyze.outputs.unverified_count }}
          TOTAL=$((VERIFIED + UNVERIFIED))
          
          # Create human-readable report
          {
            echo "# TruffleHog Secrets Scan Report"
            echo ""
            echo "## Summary"
            echo "- **Verified Secrets**: $VERIFIED"
            echo "- **Unverified Secrets**: $UNVERIFIED"
            echo "- **Total**: $TOTAL"
            echo ""
            echo "## Details"
            echo "See JSON output for detailed findings"
          } > secrets-report.md
          
          echo "report_path=secrets-report.md" >> $GITHUB_OUTPUT

      - name: Upload Artifacts
        if: inputs.upload_artifacts == true && always()
        uses: actions/upload-artifact@v4
        with:
          name: secrets-scan-results
          path: |
            secrets-*.json
            secrets-*.md
          retention-days: 90
          if-no-files-found: warn

      - name: Comment PR with Results
        if: github.event_name == 'pull_request' && inputs.comment_pr == true && steps.analyze.outputs.secrets_found == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const severity = ${{ steps.analyze.outputs.verified_count }} > 0 ? '🚨 CRITICAL' : '⚠️ WARNING';
            
            let comment = `## ${severity} - Secrets Detected\n\n`;
            comment += '### Summary\n';
            comment += '| Type | Count |\n';
            comment += '|------|-------|\n';
            comment += '| 🔴 Verified | ${{ steps.analyze.outputs.verified_count }} |\n';
            comment += '| 🟠 Unverified | ${{ steps.analyze.outputs.unverified_count }} |\n\n';
            
            if (${{ steps.analyze.outputs.verified_count }} > 0) {
              comment += '### ⚠️ CRITICAL ACTION REQUIRED\n';
              comment += '**Verified secrets detected - these may have been exposed!**\n\n';
              comment += '1. **Immediately rotate** all exposed credentials\n';
              comment += '2. **Review** the full report in artifacts\n';
              comment += '3. **Remove** secrets from code\n';
              comment += '4. **Implement** secret management solution\n\n';
            }
            
            comment += '_🔐 Scan: TruffleHog (Secrets Detection)_\n';
            
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: comment
            });

      - name: Create Critical Issue
        if: inputs.create_issue == true && steps.analyze.outputs.verified_count > 0
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          github-token: ${{ github.token }}
          script: |
            const title = `🚨 CRITICAL: Verified secrets exposed`;
            const body = `
            # 🚨 CRITICAL SECURITY ALERT
            
            **Verified secrets have been detected in the repository!**
            
            ## Summary
            - **Verified Secrets (exposed)**: ${{ steps.analyze.outputs.verified_count }}
            - **Unverified Secrets (potential)**: ${{ steps.analyze.outputs.unverified_count }}
            
            ## Immediate Actions Required
            1. ⚠️ Immediately rotate ALL exposed credentials
            2. ⚠️ Review the detailed scan report
            3. ⚠️ Remove secrets from the repository
            4. ⚠️ Consider rewriting git history if needed
            
            ## Prevention
            - Implement secret scanning in pre-commit hooks
            - Use secret management tools (AWS Secrets Manager, Vault, etc.)
            - Enable GitHub secret scanning on the repository
            - Train team on credential handling best practices
            
            **Run Details**: [View Workflow](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})
            **Contact**: Security team immediately
            `;
            
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['security', 'secrets', 'critical', 'urgent'],
              assignees: ['security-team']
            });

      - name: Summary
        if: always()
        run: |
          echo "📊 Secrets Scan Summary"
          echo "======================"
          echo "Status: ${{ steps.analyze.outputs.scan_status }}"
          echo "Secrets Found: ${{ steps.analyze.outputs.secrets_found }}"
          echo "Verified: ${{ steps.analyze.outputs.verified_count }}"
          echo "Unverified: ${{ steps.analyze.outputs.unverified_count }}"

      - name: Fail Workflow if Required
        if: inputs.fail_on_finding == true && steps.analyze.outputs.secrets_found == 'true'
        run: |
          VERIFIED=${{ steps.analyze.outputs.verified_count }}
          
          if [ "$VERIFIED" -gt 0 ]; then
            echo "🚨 CRITICAL: Verified secrets detected - workflow MUST fail"
            exit 1
          elif [ "${{ steps.analyze.outputs.unverified_count }}" -gt 0 ]; then
            echo "⚠️ Unverified secrets detected - review before proceeding"
            exit 1
          fi
